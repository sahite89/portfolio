<section id="contact" class="contact-section">
  <div class="contact-container">
    <div appScrollReveal="fadeInUp" class="contact-header">
      <h2 class="contact-title">
        <span class="contact-title-gradient">
          {{ t().contact.title }}
        </span>
      </h2>
      <p class="contact-subtitle">{{ t().contact.subtitle }}</p>
    </div>

    <div appScrollReveal="fadeInUp" [delay]="200" class="contact-card">
      <form (ngSubmit)="onSubmit(contactForm)" #contactForm="ngForm" class="contact-form">
        <div class="contact-fields">
          <div>
            <label class="contact-field-label">{{ t().contact.name }}</label>
            <input
              type="text"
              [(ngModel)]="formData.name"
              name="name"
              required
              class="contact-input"
              placeholder="Tu nombre"
            >
          </div>
          <div>
            <label class="contact-field-label">{{ t().contact.email }}</label>
            <input
              type="email"
              [(ngModel)]="formData.email"
              name="email"
              required
              class="contact-input"
              placeholder="tu@email.com"
            >
          </div>
        </div>
        <div>
          <label class="contact-field-label">{{ t().contact.message }}</label>
          <textarea
            [(ngModel)]="formData.message"
            name="message"
            required
            rows="5"
            class="contact-input contact-input--textarea"
            placeholder="Tu mensaje..."
          ></textarea>
        </div>
        <button
          type="submit"
          [disabled]="!contactForm.form.valid || loading"
          class="contact-submit"
        >
          @if (loading) {
            <svg class="contact-spinner" viewBox="0 0 24 24">
              <circle class="contact-spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="contact-spinner-path" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
          }
          {{ t().contact.send }}
        </button>
      </form>

      @if (submitted) {
        <div class="contact-feedback contact-feedback--success">
          {{ t().contact.success }}
        </div>
      }
      @if (error) {
        <div class="contact-feedback contact-feedback--error">
          Error al enviar el mensaje. Inténtalo de nuevo más tarde.
        </div>
      }
    </div>

    <div appScrollReveal="fadeInUp" [delay]="400" class="contact-socials">
      <a href="https://github.com/tuusuario" target="_blank" class="contact-social-link">
        <svg class="contact-social-icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
      </a>
      <a href="https://linkedin.com/in/tuusuario" target="_blank" class="contact-social-link">
        <svg class="contact-social-icon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      </a>
      <a href="mailto:contacto@santiagolopez.dev" class="contact-social-link">
        <svg class="contact-social-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>

    </div>
  </div>
</section>
