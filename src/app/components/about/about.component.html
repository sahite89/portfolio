<section id="about" class="about-section">
  <div class="about-container">
    <div class="about-grid">
      <div appScrollReveal="fadeInLeft" class="about-visual">
        <div class="about-avatar-wrap">
          <div class="about-avatar-bg about-avatar-bg--rotate"></div>
          <div class="about-avatar-bg about-avatar-bg--rotate-reverse"></div>
          <div class="about-avatar">
            <svg class="about-avatar-icon" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
        </div>
      </div>

      <div appScrollReveal="fadeInRight" [delay]="200">
        <h2 class="about-title">
          <span class="about-title-gradient">
            {{ t().about.title }}
          </span>
        </h2>
        @for (paragraph of t().about.description; track $index) {
          <p class="about-paragraph">{{ paragraph }}</p>
        }
        <a href="assets/cv-santiago-lopez.pdf" download class="about-cv-link">
          <svg class="about-cv-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          {{ t().about.downloadCv }}
        </a>
      </div>
    </div>
  </div>
</section>
