<section id="home" [attr.aria-label]="t().a11y.home" class="hero">
  <div class="hero-background"></div>
  <div class="hero-blobs">
    <div class="hero-blob hero-blob--primary"></div>
    <div class="hero-blob hero-blob--accent"></div>
  </div>

  <div appScrollReveal="fadeInUp" class="hero-content">
    <p class="hero-greeting animate-fade-in">
      {{ t().hero.greeting }}
    </p>
    <h1 class="hero-name">
      <span class="hero-name-gradient animate-gradient">
        Santiago Hijazo
      </span>
    </h1>
    <h2 class="hero-title">
      {{ t().hero.title }}
    </h2>
    <div class="hero-stack">
      <span class="hero-stack-tag hero-stack-tag--dotnet">{{ t().hero.stack.dotnet }}</span>
      <span class="hero-stack-tag hero-stack-tag--angular">{{ t().hero.stack.angular }}</span>
    </div>
    <p class="hero-subtitle">
      {{ t().hero.subtitle }}
    </p>
    <div class="hero-actions">
      <button (click)="scrollToProjects()" class="hero-cta animate-glow">
        {{ t().hero.cta }}
      </button>
      <a href="#contact" class="hero-cta-outline">
        {{ t().nav.contact }}
      </a>
    </div>
  </div>

  <div class="hero-scroll animate-bounce" aria-hidden="true">
    <svg class="hero-scroll-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
    </svg>
  </div>
</section>
