<section id="skills" class="skills-section">
  <div class="skills-container">
    <div appScrollReveal="fadeInUp" class="skills-header">
      <h2 class="skills-title">
        <span class="skills-title-gradient">
          {{ t().skills.title }}
        </span>
      </h2>
      <p class="skills-subtitle">{{ t().skills.subtitle }}</p>
    </div>

    <div appScrollReveal="fadeInUp" [delay]="100" class="skills-filters">
      @for (cat of categories; track cat.key) {
        <button
          (click)="setCategory(cat.key)"
          class="skills-filter-btn"
          [ngClass]="activeCategory === cat.key ? 'skills-filter-btn--active' : ''"
        >
          {{ cat.label }}
        </button>
      }
    </div>

    <div class="skills-grid">
      @for (skill of filteredSkills; track skill.name; let i = $index) {
        <div appScrollReveal="fadeInUp" [delay]="i * 80" class="skills-card group">
          <div class="skills-card-header">
            <h3 class="skills-card-name">{{ skill.name }}</h3>
            <span class="skills-card-level">{{ skill.level }}%</span>
          </div>
          <div class="skills-bar">
            <div
              class="skills-bar-fill"
              [style.width.%]="skill.level"
            ></div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
