<section id="skills" [attr.aria-label]="t().a11y.skills" class="skills-section">
  <div class="skills-container">
    <div appScrollReveal="fadeInUp" class="skills-header">
      <h2 class="skills-title">
        <span class="skills-title-gradient">
          {{ t().skills.title }}
        </span>
      </h2>
      <p class="skills-subtitle">{{ t().skills.subtitle }}</p>
    </div>

    @for (group of skillsByCategory(); track group.key) {
      <div appScrollReveal="fadeInUp" class="skills-category">
        <h3 class="skills-category-heading">
          <i [ngClass]="group.iconClass + ' colored skills-category-icon'"></i>
          <span>{{ group.label }}</span>
        </h3>

        <div class="skills-grid">
          @for (skill of group.skills; track skill.name) {
            <div class="skills-card group">
              @if (skill.deviconClass) {
                <i [ngClass]="skill.deviconClass + ' colored skills-card-icon'"></i>
              }
              <span class="skills-card-name">{{ skill.name }}</span>
            </div>
          }
        </div>
      </div>
    }
  </div>
</section>
